<!doctype html>
<html lang="es">
  <head>
    <include src="head.html"></include>
    <meta name="robots" content="noindex" />
    <title>Acceso a personal · AguaAlerta</title>
    <link rel="stylesheet" href="/src/css/login.css" />
  </head>
  <body class="auth">
    <include src="icons.html"></include>

    <aside class="auth__media">
      <div class="auth__veil" aria-hidden="true"></div>
      <div class="auth__media-content">
        <include src="logo.html" href="/" label="inicio" modifier="logo--inverse"></include>

        <figure class="auth__quote">
          <blockquote class="auth__quote-text">“Tecnología para que cada decisión hídrica llegue a tiempo.”</blockquote>
          <figcaption class="auth__quote-author">Centro Municipal de Operaciones</figcaption>
        </figure>
      </div>
      <small class="auth__credit">Foto: Ivan Bandura / Unsplash</small>
    </aside>

    <main class="auth__panel">
      <a class="auth__back" href="/">← Volver al portal público</a>

      <form class="login-form" novalidate>
        <div class="login-form__brand">
          <include src="logo.html" href="/" label="inicio" modifier=""></include>
        </div>

        <p class="eyebrow">Acceso restringido</p>
        <h1 class="login-form__title">Bienvenido a<br />AguaAlerta</h1>
        <p class="login-form__subtitle">Ingresa tus credenciales institucionales para continuar.</p>

        <div class="login-form__alert" id="login-alerta" role="alert" hidden>
          <svg class="icon" aria-hidden="true"><use href="#alert-triangle" /></svg>
          <span>
            <b class="login-form__alert-title"></b>
            <small class="login-form__alert-text"></small>
          </span>
        </div>

        <div class="login-form__field">
          <label class="login-form__label" for="usuario">Usuario o correo institucional</label>
          <div class="login-form__control">
            <input
              class="login-form__input"
              id="usuario"
              name="usuario"
              type="text"
              placeholder="nombre@municipio.gob.mx"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="login-form__field">
          <label class="login-form__label" for="password">Contraseña</label>
          <div class="login-form__control">
            <input
              class="login-form__input"
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button class="login-form__toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#eye" /></svg>
            </button>
          </div>
        </div>

        <div class="login-form__options">
          <label class="login-form__remember">
            <input type="checkbox" name="recordar" />
            Mantener sesión iniciada
          </label>
          <a class="login-form__link" href="#">¿Problemas para ingresar?</a>
        </div>

        <button class="button button--block login-form__submit" type="submit">Iniciar sesión</button>
        <a class="login-form__employee" href="/registro-empleado.html">Alta de empleado con master key</a>

        <small class="login-form__note">Acceso cifrado y monitoreado · v2.4.1</small>
      </form>
    </main>

    <script type="module" src="/src/js/login.js"></script>
  </body>
</html>
