<aside class="sidebar" id="sidebar" aria-label="Navegación del sistema">
  <div class="sidebar__brand">
    <include
      src="logo.html"
      href="/home.html"
      label="home"
      modifier="logo--inverse"
    ></include>
    <button class="sidebar__close" type="button" aria-label="Cerrar menú">
      <svg class="icon" aria-hidden="true"><use href="#x" /></svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <p class="sidebar__section">Operación</p>
    <ul class="sidebar__list">
      <li>
        <a
          class="sidebar__link sidebar__link--active"
          href="/home.html"
          aria-current="page"
        >
          <svg class="icon icon--lg" aria-hidden="true">
            <use href="#home" />
          </svg>
          Dashboard general
        </a>
      </li>
      <li>
        <a class="sidebar__link" href="#">
          <svg class="icon icon--lg" aria-hidden="true">
            <use href="#file-text" />
          </svg>
          Reportes
          <span class="sidebar__badge" data-badge-reportes hidden></span>
        </a>
      </li>
      <li>
        <a class="sidebar__link" href="#">
          <svg class="icon icon--lg" aria-hidden="true">
            <use href="#database" />
          </svg>
          Depósitos &amp; IoT
          <span
            class="sidebar__badge sidebar__badge--alert"
            data-badge-depositos
            hidden
          ></span>
        </a>
      </li>
      <li>
        <a class="sidebar__link" href="#">
          <svg class="icon icon--lg" aria-hidden="true">
            <use href="#user-check" />
          </svg>
          Técnicos
        </a>
      </li>
      <li>
        <a class="sidebar__link" href="#">
          <svg class="icon icon--lg" aria-hidden="true">
            <use href="#users" />
          </svg>
          Usuarios
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__shift">
      <span class="sidebar__shift-status">
        <span class="status-dot status-dot--pulse" aria-hidden="true"></span>
        Turno en línea
      </span>
      <span class="sidebar__shift-time">08:00–16:00</span>
    </div>

    <div class="user-card">
      <span class="avatar" data-usuario-iniciales></span>
      <div class="user-card__info">
        <span class="user-card__name" data-usuario-nombre></span>
        <span class="user-card__role" data-usuario-rol></span>
      </div>
      <a
        class="user-card__logout"
        href="/login.html"
        data-cerrar-sesion
        aria-label="Cerrar sesión"
      >
        <svg class="icon icon--lg" aria-hidden="true">
          <use href="#log-out" />
        </svg>
      </a>
    </div>
  </div>
</aside>
